name: R5 formal GreenLight field-flux experiment

on:
  push:
    branches: [r5-field-ventilation-flux]
    paths: [physbench/r5/R5_FORMAL_TRIGGER_ONCE_20261020_v3.txt]

permissions:
  contents: read
  actions: read

concurrency:
  group: r5-formal-one-shot
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      trigger_audit: ${{ steps.scope.outputs.trigger_audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check the one-time marker and workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GH_RUN_ATTEMPT" = "1"
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          run_id = str(os.environ["GH_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          workflow = "physbench_r5_formal.yml"
          branch = "r5-field-ventilation-flux"
          marker = "physbench/r5/R5_FORMAL_TRIGGER_ONCE_20261020_v3.txt"
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          commit = get_json(f"{base}/commits/{os.environ['GH_SHA']}")
          changed = commit.get("files", [])
          if len(changed) != 1 or changed[0].get("filename") != marker or changed[0].get("status") != "added":
              raise SystemExit("One-time guard failed: trigger commit must add only the designated marker.")
          payload = get_json(f"{base}/actions/workflows/{workflow}/runs?branch={branch}&per_page=100")
          runs = payload.get("workflow_runs", [])
          run_ids = [str(r.get("id")) for r in runs]
          if len(runs) != 3 or run_id not in run_ids or "39372067352" not in run_ids or "39387663913" not in run_ids:
              raise SystemExit("One-time guard failed: workflow history must contain exactly three runs: 39372067352, 39387663913 and the current run.")
          jobs_3937 = get_json(f"{base}/actions/runs/39372067352/jobs")
          m1_3937 = [j for j in jobs_3937.get("jobs", []) if j.get("name") == "m1"]
          if not m1_3937 or m1_3937[0].get("conclusion") != "skipped" or len(m1_3937[0].get("steps", [])) != 0:
              raise SystemExit("One-time guard failed: prior run 39372067352 m1 job was not skipped with 0 executed steps.")
          jobs_3938 = get_json(f"{base}/actions/runs/39387663913/jobs")
          m1_3938 = [j for j in jobs_3938.get("jobs", []) if j.get("name") == "m1"]
          if not m1_3938 or m1_3938[0].get("conclusion") != "failure":
              raise SystemExit("One-time guard failed: prior run 39387663913 m1 job was not failed.")
          art_1224 = get_json(f"{base}/actions/artifacts/12248087110")
          if art_1224.get("name") != "r5-formal-m1" or art_1224.get("workflow_run", {}).get("id") != 39387663913 or art_1224.get("expired") is True:
              raise SystemExit("One-time guard failed: artifact 12248087110 is not valid r5-formal-m1 from run 39387663913.")
          print("One-time guard PASS: attempt 1; marker-only commit; exactly three formal runs on branch; prior runs verified.")
          PY

      - name: Audit every branch-matching push workflow and enforce static scope
        id: scope
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          require "json"
          branch = "r5-field-ventilation-flux"
          old_c8 = "physbench_r5_c8_reproduction.yml"
          reaudit = "physbench_r5_c8_reaudit.yml"
          formal = "physbench_r5_formal.yml"
          diag_d1 = "physbench_r5_diag_d1.yml"
          diag_d1_v2 = "physbench_r5_diag_d1_v2.yml"
          old_c8_marker = "physbench/r5/C8_TRIGGER_ONCE_20261020B.txt"
          reaudit_marker = "physbench/r5/C8_REAUDIT_TRIGGER_ONCE_20261020.txt"
          formal_marker = "physbench/r5/R5_FORMAL_TRIGGER_ONCE_20261020_v3.txt"
          old_formal_marker = "physbench/r5/R5_FORMAL_TRIGGER_ONCE_20261020.txt"
          v2_formal_marker = "physbench/r5/R5_FORMAL_TRIGGER_ONCE_20261020_v2.txt"
          diag_d1_marker = "physbench/r5/R5_DIAG_D1_TRIGGER_ONCE_20261020.txt"
          diag_d1_v2_marker = "physbench/r5/R5_DIAG_D1_TRIGGER_ONCE_20261020_v2.txt"
          def events_for(document)
            document["on"] || document[true] || {}
          end
          def branch_matches?(push, target)
            return false unless push.is_a?(Hash)
            include_list = push["branches"]
            exclude_list = push["branches-ignore"]
            included = include_list.nil? || Array(include_list).any? { |x| File.fnmatch?(x.to_s, target) }
            excluded = exclude_list && Array(exclude_list).any? { |x| File.fnmatch?(x.to_s, target) }
            included && !excluded
          end
          docs = {}
          Dir.glob(".github/workflows/*.{yml,yaml}").sort.each do |path|
            doc = YAML.safe_load_file(path, aliases: false) || {}
            docs[File.basename(path)] = doc
          end
          matching = docs.select do |_name, doc|
            events = events_for(doc)
            branch_matches?(events["push"], branch)
          end
          expected_names = [old_c8, reaudit, formal, diag_d1, diag_d1_v2].sort
          abort "Trigger audit failed: unexpected branch-matching workflows: #{matching.keys.sort.inspect}" unless matching.keys.sort == expected_names
          expected_paths = {
            old_c8 => [old_c8_marker],
            reaudit => [reaudit_marker],
            formal => [formal_marker],
            diag_d1 => [diag_d1_marker],
            diag_d1_v2 => [diag_d1_v2_marker],
          }
          matching.each do |name, doc|
            events = events_for(doc)
            abort "Trigger audit failed: #{name} has a non-push trigger." unless events.keys.map(&:to_s) == ["push"]
            push = events["push"]
            paths = Array(push["paths"])
            abort "Trigger audit failed: #{name} path filter changed: #{paths.inspect}" unless paths == expected_paths.fetch(name)
          end
          changed_files = `git diff-tree --no-commit-id --name-only -r HEAD`.split("\n").map(&:strip)
          forbidden_markers = [old_c8_marker, reaudit_marker, old_formal_marker, v2_formal_marker, diag_d1_marker, diag_d1_v2_marker]
          touched_forbidden = changed_files & forbidden_markers
          abort "Trigger audit failed: push touches forbidden markers: #{touched_forbidden.inspect}" unless touched_forbidden.empty?
          formal_doc = docs.fetch(formal)
          formal_events = events_for(formal_doc)
          abort "Static scope failed: formal workflow trigger is not branch/path restricted push." unless
            formal_events.keys.map(&:to_s) == ["push"] &&
            Array(formal_events.dig("push", "branches")) == [branch] &&
            Array(formal_events.dig("push", "paths")) == [formal_marker]
          abort "Static scope failed: permissions differ." unless
            formal_doc["permissions"] == { "contents" => "read", "actions" => "read" }
          abort "Static scope failed: concurrency differs." unless
            formal_doc["concurrency"] == { "group" => "r5-formal-one-shot", "cancel-in-progress" => false }
          jobs = formal_doc["jobs"] || {}
          abort "Static scope failed: job set differs." unless jobs.keys.sort == ["aggregate", "guard", "m1", "prepare"]
          source = File.read("physbench/r5/m1_r5_formal.py")
          m1_scope = jobs.fetch("m1").to_s + source
          forbidden = ["CSGtom", "m2_", "least_squares", "curve_fit"]
          found = forbidden.select { |word| m1_scope.include?(word) }
          abort "Static scope failed: forbidden model-scope text found: #{found.inspect}" unless found.empty?
          abort "Static scope failed: conditions list differs." unless
            source.include?("CONDITIONS = ['REF0', 'FF0', 'FFN', 'FFH']")
          uploads = []
          jobs.each_value do |job|
            Array(job["steps"]).each do |step|
              if step["uses"].to_s.start_with?("actions/upload-artifact@")
                uploads << step.dig("with", "name")
              end
            end
          end
          expected_uploads = ["r5-formal-prepared-inputs", "r5-formal-m1", "r5-formal-final"]
          abort "Static scope failed: artifact names differ: #{uploads.inspect}" unless uploads == expected_uploads
          report = "PASS; branch=#{branch}; matches=#{old_c8}:#{old_c8_marker},#{reaudit}:#{reaudit_marker},#{formal}:#{formal_marker}; only formal marker matches this push; previous markers and workflows unchanged; jobs=guard,prepare,m1,aggregate; artifacts=#{expected_uploads.join(',')}"
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |f| f.puts("trigger_audit=#{report}") }
          puts "Trigger audit PASS: #{report}"
          RUBY

  prepare:
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen input-audit runtime
        run: python -m pip install pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - name: Verify frozen R4 prepared-input artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p physbench/r5/generated
          python - <<'PY'
          import json, os, urllib.request
          expected = {
              "id": 11289046331,
              "name": "r4-prepared-inputs",
              "run_id": 37164458429,
              "digest": "sha256:ecff6bc7586f07aac393c26698488cd98164bee418f0a71fdae9f60fe4fafe0f",
          }
          repo = os.environ["GH_REPOSITORY"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{expected['id']}",
              headers={"Accept":"application/vnd.github+json",
                       "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req, timeout=30) as response:
              actual = json.load(response)
          checks = {
              "id": actual.get("id") == expected["id"],
              "name": actual.get("name") == expected["name"],
              "run_id": actual.get("workflow_run", {}).get("id") == expected["run_id"],
              "digest": actual.get("digest") == expected["digest"],
              "not_expired": actual.get("expired") is False,
          }
          result = {"status":"PASS" if all(checks.values()) else "FAIL",
                    "expected":expected,"actual":actual,"checks":checks}
          with open("physbench/r5/generated/r4_prepared_artifact_identity.json","w") as f:
              json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          if not all(checks.values()):
              raise SystemExit("Frozen R4 prepared-input artifact identity failed.")
          PY
      - name: Download frozen R4 prepared inputs
        uses: actions/download-artifact@v4
        with:
          name: r4-prepared-inputs
          path: physbench/r5/generated
          run-id: 37164458429
          github-token: ${{ github.token }}
      - name: Run the frozen field-flux reference test
        run: |
          set -euo pipefail
          python -I physbench/r5/field_flux.py 2>&1 | tee physbench/r5/generated/field_flux_unit_tests.log
      - name: Validate frozen source hashes, input digest, and 97/40 event join
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import pandas as pd
          root=Path(".")
          required={
              "physbench/r5/00_R5_CODEX_PROTOCOL.md",
              "physbench/r5/01_PROVENANCE_AND_INPUTS.md",
              "physbench/r5/02_PROTOCOL_CLARIFICATIONS.md",
              "physbench/r5/field_flux.py",
              "physbench/r5/field_ventilation_function.json",
              "physbench/r5/R5_event_list_97_v2.csv",
          }
          lock=root/"physbench/r5/R5_FORMAL_EXECUTION_LOCK.md"
          locked={}
          for line in lock.read_text(encoding="utf-8").splitlines():
              parts=line.split("|")
              if len(parts)>=4:
                  name=parts[1].strip()
                  digest=parts[2].strip()
                  if len(name)>2 and len(digest)>2:
                      name,digest=name[1:-1],digest[1:-1].lower()
                      if re.fullmatch(r"[0-9a-f]{64}",digest):
                          locked[name]=digest
          checks={}
          actual_hashes={}
          for rel in sorted(required):
              actual=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              actual_hashes[rel]=actual
              checks["lock:"+rel]=locked.get(rel)==actual
          source=root/"physbench/r5/generated/PRIMARY_97_R2_INPUT.csv"
          eventlist=root/"physbench/r5/R5_event_list_97_v2.csv"
          input_hash=hashlib.sha256(source.read_bytes()).hexdigest()
          checks["R4_primary_input_SHA256"]=input_hash=="0127756518d8a481d8f79e27b0a0d57bd2b9e6d9d94232202109869f5a792d5b"
          checks["field_flux_unit_tests"]=(
              "field_flux unit tests PASS" in (root/"physbench/r5/generated/field_flux_unit_tests.log").read_text()
          )
          inp=pd.read_csv(source)
          ev=pd.read_csv(eventlist)
          inp["row_index"]=inp.row_index.astype(int)
          ev["row_index"]=ev.row_index.astype(int)
          joined=inp.merge(ev[["row_index","event_id","in_R4_wind_3_6_subset"]],
                           on="row_index",how="outer",suffixes=("","_event_list"),
                           indicator=True,validate="one_to_one")
          checks["97_primary_unique"]=len(inp)==97 and inp.event_id.astype(str).nunique()==97 and inp.row_index.nunique()==97
          checks["97_event_list_unique"]=len(ev)==97 and ev.event_id.astype(str).nunique()==97 and ev.row_index.nunique()==97
          checks["row_index_join_97_of_97"]=len(joined)==97 and bool((joined._merge=="both").all())
          checks["event_id_matches_after_row_index_join"]=bool((joined.event_id.astype(str)==joined.event_id_event_list.astype(str)).all())
          def as_bool(s):
              if pd.api.types.is_bool_dtype(s): return s.astype(bool)
              return s.astype(str).str.lower().map({"true":True,"false":False})
          a=as_bool(inp.anchor_primary_3_6)
          b=as_bool(joined.in_R4_wind_3_6_subset)
          checks["anchor_primary_3_6_count_and_flags"]=int(a.sum())==40 and bool((a.to_numpy()==b.to_numpy()).all())
          ident=json.loads((root/"physbench/r5/generated/r4_prepared_artifact_identity.json").read_text())
          checks["R4_prepared_artifact_identity"]=ident.get("status")=="PASS"
          report={"status":"PASS" if all(checks.values()) else "FAIL",
                  "checks":checks,"source_sha256":actual_hashes,
                  "R4_primary_input_sha256":input_hash,
                  "prepared_artifact":ident.get("actual"),
                  "unit_test_log":"physbench/r5/generated/field_flux_unit_tests.log"}
          out=root/"physbench/r5/generated/R5_PREPARE_GATE_SUMMARY.json"
          out.write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          (root/"physbench/r5/generated/prepare_validation.log").write_text(
              json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2))
          if report["status"]!="PASS":
              raise SystemExit("R5 prepare gate failed.")
          PY
      - name: Download frozen R3 M1 HV reference for offline test
        uses: actions/download-artifact@v4
        with:
          name: r3-m1
          path: baseline_r3
          run-id: 37163085468
          github-token: ${{ github.token }}
      - name: Download frozen R4 M1 CF0 reference for offline test
        uses: actions/download-artifact@v4
        with:
          name: r4-m1
          path: baseline_r4
          run-id: 37164458429
          github-token: ${{ github.token }}
      - name: Download run 39387663913 formal M1 artifact for offline test
        uses: actions/download-artifact@v4
        with:
          name: r5-formal-m1
          path: baseline_r5_v2
          run-id: 39387663913
          github-token: ${{ github.token }}
      - name: Run offline aggregate test
        run: |
          set -euo pipefail
          python physbench/r5/test_aggregate_offline.py
      - name: Upload validated frozen prepared inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-formal-prepared-inputs
          path: physbench/r5/generated/
          retention-days: 90
          if-no-files-found: warn

  m1:
    needs: [guard, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen R4 C8 reference identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          expected={"id":11289405542,"name":"r4-m1","run_id":37164458429,
                    "digest":"sha256:8a9867cfd9c1935668a4123990595b8085bed03daeb5d9a4e49e07f1e06fd47c"}
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/artifacts/{expected['id']}"
          req=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json",
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],"X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=30) as response: actual=json.load(response)
          checks={"id":actual.get("id")==expected["id"],"name":actual.get("name")==expected["name"],
                  "run_id":actual.get("workflow_run",{}).get("id")==expected["run_id"],
                  "digest":actual.get("digest")==expected["digest"],"not_expired":actual.get("expired") is False}
          print(json.dumps({"expected":expected,"actual":actual,"checks":checks},indent=2))
          if not all(checks.values()): raise SystemExit("Frozen R4 C8 reference identity failed.")
          PY
      - name: Download validated R5 inputs
        uses: actions/download-artifact@v4
        with:
          name: r5-formal-prepared-inputs
          path: physbench/r5/generated
      - name: Download frozen R4 CF0 reference for pre-FF C8 gate
        uses: actions/download-artifact@v4
        with:
          name: r4-m1
          path: baseline_c8
          run-id: 37164458429
          github-token: ${{ github.token }}
      - name: Install frozen M1 GreenLight and R4 dependency set
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/BartvLaatum/GreenLight-Gym2.git GreenLight-Gym2
          git -C GreenLight-Gym2 checkout --detach 2d3febb1ea002b24b452e32293e990beb78d3ce1
          python -m pip install --upgrade pip
          python -m pip install -r physbench/r1_2/requirements-m1.txt -c physbench/r5/r4-pip-constraints.txt ./GreenLight-Gym2
          python -m pip freeze | sort > evidence_R5_M1_PIP_FREEZE.txt
      - name: Run GreenLight M1 after the 40-event REF0 gate
        run: |
          set -euo pipefail
          mkdir -p evidence/R5/FORMAL
          python physbench/r5/m1_r5_formal.py 2>&1 | tee evidence/R5/FORMAL/r5_formal_m1_console.log
      - name: Upload M1 results and complete model log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-formal-m1
          path: |
            evidence/R5/FORMAL/
            evidence_R5_M1_PIP_FREEZE.txt
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    needs: [guard, prepare, m1]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen aggregate runtime
        run: python -m pip install pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - name: Download prepared inputs from this run
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r5-formal-prepared-inputs
          path: prepared
      - name: Download M1 results from this run
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r5-formal-m1
          path: model-output
      - name: Download frozen R3 M1 HV reference
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r3-m1
          path: baseline_r3
          run-id: 37163085468
          github-token: ${{ github.token }}
      - name: Download frozen R4 M1 CF0 reference
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r4-m1
          path: baseline_r4
          run-id: 37164458429
          github-token: ${{ github.token }}
      - name: Preserve model outputs and partial gate diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/R5/FORMAL
          if [ -d model-output/evidence/R5/FORMAL ]; then
            cp -R model-output/evidence/R5/FORMAL/. evidence/R5/FORMAL/
          fi
      - name: Preserve logs and compute frozen artifact identity checks
        id: artifact_gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence/R5/FORMAL/logs
          cp prepared/field_flux_unit_tests.log evidence/R5/FORMAL/logs/field_flux_unit_tests.log 2>/dev/null || true
          cp prepared/prepare_validation.log evidence/R5/FORMAL/logs/prepare_validation.log 2>/dev/null || true
          cp model-output/evidence/R5/FORMAL/r5_formal_m1_console.log evidence/R5/FORMAL/logs/r5_formal_m1_console.log 2>/dev/null || true
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GH_REPOSITORY"]; token=os.environ["GH_TOKEN"]; run_id=int(os.environ["GH_RUN_ID"])
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,
                   "X-GitHub-Api-Version":"2022-11-28"}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          expected=[
              {"id":11289046331,"name":"r4-prepared-inputs","run_id":37164458429,
               "digest":"sha256:ecff6bc7586f07aac393c26698488cd98164bee418f0a71fdae9f60fe4fafe0f"},
              {"id":11288765689,"name":"r3-m1","run_id":37163085468,
               "digest":"sha256:de6ae266728fed2ed535a5f591c5c1778b74ee75a750ddfb4f65ae32be1d0979"},
              {"id":11289405542,"name":"r4-m1","run_id":37164458429,
               "digest":"sha256:8a9867cfd9c1935668a4123990595b8085bed03daeb5d9a4e49e07f1e06fd47c"},
          ]
          checks=[]; records=[]
          for item in expected:
              actual=get_json(f"https://api.github.com/repos/{repo}/actions/artifacts/{item['id']}")
              passed=(actual.get("id")==item["id"] and actual.get("name")==item["name"]
                      and actual.get("workflow_run",{}).get("id")==item["run_id"]
                      and actual.get("digest")==item["digest"] and actual.get("expired") is False)
              checks.append({"name":item["name"],"passed":passed,"expected":item,"actual":{
                  "id":actual.get("id"),"name":actual.get("name"),
                  "run_id":actual.get("workflow_run",{}).get("id"),
                  "digest":actual.get("digest"),"expired":actual.get("expired")}})
              records.append({"name":item["name"],"id":item["id"],"run_id":item["run_id"],
                              "digest":actual.get("digest"),"status":"PASS" if passed else "FAIL"})
          current=get_json(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
          by_name={a.get("name"):a for a in current.get("artifacts",[])}
          for name in ["r5-formal-prepared-inputs","r5-formal-m1"]:
              actual=by_name.get(name)
              passed=(actual is not None and actual.get("expired") is False
                      and actual.get("workflow_run",{}).get("id")==run_id
                      and bool(actual.get("digest")))
              checks.append({"name":name,"passed":passed,"current_run_artifact":actual})
              if actual:
                  records.append({"name":name,"id":actual.get("id"),"run_id":run_id,
                                  "digest":actual.get("digest"),"status":"PASS" if passed else "FAIL"})
          report={"status":"PASS" if all(x["passed"] for x in checks) else "FAIL",
                  "artifacts":records,"checks":checks}
          out="evidence/R5/FORMAL/artifact_identity.json"
          with open(out,"w") as f: json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          if report["status"]!="PASS": raise SystemExit("Frozen/current artifact identity gate failed.")
          PY
      - name: Run formal R5 aggregate and all post-run gates
        if: success() && steps.artifact_gate.outcome == 'success'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          M1_RESULT: ${{ needs.m1.result }}
          GUARD_RESULT: ${{ needs.guard.result }}
          TRIGGER_AUDIT: ${{ needs.guard.outputs.trigger_audit }}
        run: |
          set -euo pipefail
          ARTIFACT_IDENTITIES_JSON="$(cat evidence/R5/FORMAL/artifact_identity.json)" \
            python -I physbench/r5/aggregate_r5.py 2>&1 | tee evidence/R5/FORMAL/logs/aggregate_console.log
      - name: Write a fail-closed report when artifact identity verification fails
        if: always() && steps.artifact_gate.outcome != 'success'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          M1_RESULT: ${{ needs.m1.result }}
        run: |
          mkdir -p evidence/R5/FORMAL/logs
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path("evidence/R5/FORMAL")
          summary={"status":"FAIL","passed":False,"workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
                   "prepare_result":os.environ.get("PREPARE_RESULT"),"m1_result":os.environ.get("M1_RESULT"),
                   "error":"Artifact identity verification failed; no aggregation was performed.",
                   "artifact_identity_path":"artifact_identity.json"}
          (out/"R5_gate_summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          (out/"R5_run_log.md").write_text("# R5 formal run log\n\nStatus: FAIL\n\n"+
             summary["error"]+"\n")
          for name,header in [
              ("R5_event_responses.csv","event_id,row_index,event_date,direction,anchor_primary_3_6,condition,horizon_min,dT_model,dAH_model,dT_obs,dAH_obs,q_pre_top,q_post_top,q_pre_main,q_post_main,hfac\n"),
              ("R5_summary.csv","cohort,condition,variable,horizon_min\n"),
              ("R5_paired_differences.csv","cohort,variable,horizon_min,comparison,endpoint\n"),
              ("R5_HV_reference_used.csv",""),
              ("R5_runtime_audit.csv",""),
              ("R5_alignment_states.csv",""),
              ("R5_embedded_C8_event_comparison.csv",""),
          ]:
              if not (out/name).exists(): (out/name).write_text(header)
          PY
      - name: Upload final formal R5 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-formal-final
          path: evidence/R5/FORMAL/
          retention-days: 90
          if-no-files-found: error

