name: PhysBench EXP3.4A Physical Ventilation Dose

on:
  workflow_dispatch:
  push:
    branches: [exp3-4a-physical-ventilation-dose]

permissions:
  contents: read

jobs:
  protocol-and-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Run frozen protocol tests
        run: |
          set -euxo pipefail
          python physbench/exp3_4a/test_protocol.py -v
      - name: Compile execution files
        run: |
          set -euxo pipefail
          python -m py_compile physbench/exp3_4a/m1_physical_dose.py
          python -m py_compile physbench/exp3_4a/m2_physical_dose.py
          python -m py_compile physbench/exp3_4a/aggregate_exp3_4a.py

  m1:
    needs: protocol-and-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M1
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp3_1/requirements-m1.txt
          python -m pip install 'git+https://github.com/BartvLaatum/GreenLight-Gym2.git@2d3febb1ea002b24b452e32293e990beb78d3ce1'
          python -m pip freeze | sort > EXP3_4A_M1_PIP_FREEZE.txt
      - name: Same-run untouched EXP3.1 M1 reference
        run: |
          set -euxo pipefail
          python physbench/exp3_1/m1_action_grid.py
      - name: Instrument M1 physical dose
        run: |
          set -euxo pipefail
          python physbench/exp3_4a/m1_physical_dose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp3-4a-m1
          path: |
            evidence/M1/
            evidence/EXP3_4A_M1/
            EXP3_4A_M1_PIP_FREEZE.txt
            physbench/exp3_4a/
          retention-days: 90
          if-no-files-found: error

  m2:
    needs: protocol-and-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M2
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          git -C CSGtom checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp3_1/requirements-m2.txt
          python -m pip freeze | sort > EXP3_4A_M2_PIP_FREEZE.txt
      - name: Same-run untouched EXP3.1 M2 reference
        run: |
          set -euxo pipefail
          python physbench/exp3_1/m2_action_grid.py
      - name: Instrument M2 physical dose
        run: |
          set -euxo pipefail
          python physbench/exp3_4a/m2_physical_dose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp3-4a-m2
          path: |
            evidence/M2/
            evidence/EXP3_4A_M2/
            EXP3_4A_M2_PIP_FREEZE.txt
            physbench/exp3_4a/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [m1,m2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: exp3-4a-m1
          path: _m1
      - uses: actions/download-artifact@v4
        with:
          name: exp3-4a-m2
          path: _m2
      - name: Stage evidence
        run: |
          set -euxo pipefail
          mkdir -p evidence/EXP3_4A_M1 evidence/EXP3_4A_M2
          cp -a _m1/evidence/EXP3_4A_M1/. evidence/EXP3_4A_M1/
          cp -a _m2/evidence/EXP3_4A_M2/. evidence/EXP3_4A_M2/
      - name: Aggregate physical-dose equivalence
        run: |
          set -euxo pipefail
          python physbench/exp3_4a/aggregate_exp3_4a.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp3-4a-final
          path: |
            evidence/EXP3_4A_M1/
            evidence/EXP3_4A_M2/
            evidence/EXP3_4A_FINAL/
            physbench/exp3_4a/
          retention-days: 90
          if-no-files-found: error
