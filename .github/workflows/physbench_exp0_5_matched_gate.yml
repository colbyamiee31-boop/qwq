name: PhysBench EXP0.5 Matched Forcing + Initial State Gate

on:
  push:
    branches: [exp0-5-matched-forcing-init]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-matched-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M1
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4'
          python -m pip install 'git+https://github.com/BartvLaatum/GreenLight-Gym2.git@2d3febb1ea002b24b452e32293e990beb78d3ce1'
          python -m pip freeze | sort > EXP0_5_M1_PIP_FREEZE.txt
      - name: Run M1 matched forcing/init gate
        run: python physbench/exp0_5/m1_matched_gate.py
      - name: Upload M1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp0-5-m1-matched-gate
          path: |
            EXP0_5_M1_MATCHED_GATE_RESULT.json
            EXP0_5_M1_PIP_FREEZE.txt
            physbench/exp0_5/benchmark_forcing.csv
            physbench/exp0_5/matched_initial_state.json
            physbench/exp0_5/m1_matched_gate.py
          if-no-files-found: warn
          retention-days: 30

  m2-matched-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone frozen M2 and install legacy-compatible stack
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          cd CSGtom
          git checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          test "$(git rev-parse HEAD)" = "bea8c3b0a1324162a4b5487db578aa674c8b587c"
          cd ..
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.23.5' 'scipy==1.14.1' 'pandas==2.2.3' 'xlrd==2.0.1'
          python -m pip freeze | sort > EXP0_5_M2_PIP_FREEZE.txt
      - name: Run M2 matched forcing/init gate
        shell: bash
        run: |
          cd CSGtom/models
          python ../../physbench/exp0_5/m2_matched_gate.py
      - name: Upload M2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp0-5-m2-matched-gate
          path: |
            EXP0_5_M2_MATCHED_GATE_RESULT.json
            EXP0_5_M2_PIP_FREEZE.txt
            physbench/exp0_5/benchmark_forcing.csv
            physbench/exp0_5/matched_initial_state.json
            physbench/exp0_5/m2_matched_gate.py
          if-no-files-found: warn
          retention-days: 30
