name: PhysBench EXP0.6B Slow Memory Horizon Mechanism

on:
  workflow_dispatch:
  push:
    branches: [exp0-6-latent-state-robustness]

permissions:
  contents: read

jobs:
  protocol-and-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Re-run frozen EXP0.6 protocol tests
        run: python physbench/exp0_6/test_protocol.py -v
      - name: Compile EXP0.6B execution files
        run: |
          set -euxo pipefail
          python -m py_compile physbench/exp0_6/m1_slow_memory_horizon_mechanism.py
          python -m py_compile physbench/exp0_6/m2_slow_memory_horizon_mechanism.py
          python -m py_compile physbench/exp0_6/aggregate_exp0_6b.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('physbench/exp0_6/exp0_6a_72h_state_hashes.json')
          j=json.loads(p.read_text())
          expected=['H00','H01','H04','H06','H07','H10','H11','H13','H16']
          assert j['history_ids']==expected
          assert set(j['M1'])==set(expected)
          assert set(j['M2'])==set(expected)
          assert set(j['M1_H900_root_ppm'])==set(expected)
          assert set(j['M2_H900_root_ppm'])==set(expected)
          print('EXP0.6B regression lock PASS')
          PY

  m1-exp0-6b:
    needs: protocol-and-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M1
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
          python -m pip install 'git+https://github.com/BartvLaatum/GreenLight-Gym2.git@2d3febb1ea002b24b452e32293e990beb78d3ce1'
          python -m pip freeze | sort > EXP0_6B_M1_PIP_FREEZE.txt
      - name: Execute M1 slow-memory horizon mechanism analysis
        run: |
          set -euxo pipefail
          python physbench/exp0_6/m1_slow_memory_horizon_mechanism.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp0-6b-m1
          path: |
            evidence/EXP0_6B_M1/
            EXP0_6B_M1_PIP_FREEZE.txt
            physbench/exp0_6/
          retention-days: 90
          if-no-files-found: error

  m2-exp0-6b:
    needs: protocol-and-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M2
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          git -C CSGtom checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.23.5' 'scipy==1.14.1' 'pandas==2.2.3' 'xlrd==2.0.1'
          python -m pip freeze | sort > EXP0_6B_M2_PIP_FREEZE.txt
      - name: Execute M2 slow-memory horizon mechanism analysis
        run: |
          set -euxo pipefail
          python physbench/exp0_6/m2_slow_memory_horizon_mechanism.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp0-6b-m2
          path: |
            evidence/EXP0_6B_M2/
            EXP0_6B_M2_PIP_FREEZE.txt
            physbench/exp0_6/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [m1-exp0-6b,m2-exp0-6b]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: exp0-6b-m1
          path: _m1
      - uses: actions/download-artifact@v4
        with:
          name: exp0-6b-m2
          path: _m2
      - name: Stage model evidence
        run: |
          set -euxo pipefail
          mkdir -p evidence/EXP0_6B_M1 evidence/EXP0_6B_M2
          cp -a _m1/evidence/EXP0_6B_M1/. evidence/EXP0_6B_M1/
          cp -a _m2/evidence/EXP0_6B_M2/. evidence/EXP0_6B_M2/
      - name: Aggregate EXP0.6B
        run: |
          set -euxo pipefail
          python physbench/exp0_6/aggregate_exp0_6b.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp0-6b-final
          path: |
            evidence/EXP0_6B_M1/
            evidence/EXP0_6B_M2/
            evidence/EXP0_6B_FINAL/
            physbench/exp0_6/
          retention-days: 90
          if-no-files-found: error
