name: PhysBench EXP2.1C D2 Model Alignment

on:
  workflow_dispatch:
  push:
    branches: [exp2-1c-d2-model-alignment]

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 numpy==1.26.4
      - run: python physbench/exp2_1c/test_protocol.py -v

  m1:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M1
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/BartvLaatum/GreenLight-Gym2.git GreenLight-Gym2
          git -C GreenLight-Gym2 checkout --detach 2d3febb1ea002b24b452e32293e990beb78d3ce1
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp2_1c/requirements-m1.txt ./GreenLight-Gym2
          python -m pip freeze | sort > evidence_M1_PIP_FREEZE.txt
      - name: Run M1 on frozen 61-event cohort
        run: python physbench/exp2_1c/m1_run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp2-1c-m1
          path: |
            evidence/M1/
            evidence_M1_PIP_FREEZE.txt
          retention-days: 90
          if-no-files-found: error

  m2:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M2
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          git -C CSGtom checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp2_1c/requirements-m2.txt
          python -m pip freeze | sort > evidence_M2_PIP_FREEZE.txt
      - name: Run M2 on frozen 61-event cohort
        run: python physbench/exp2_1c/m2_run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp2-1c-m2
          path: |
            evidence/M2/
            evidence_M2_PIP_FREEZE.txt
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [m1,m2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - uses: actions/download-artifact@v4
        with:
          name: exp2-1c-m1
          path: dl_m1
      - uses: actions/download-artifact@v4
        with:
          name: exp2-1c-m2
          path: dl_m2
      - name: Assemble evidence paths
        run: |
          mkdir -p evidence/M1 evidence/M2
          cp -r dl_m1/evidence/M1/* evidence/M1/
          cp -r dl_m2/evidence/M2/* evidence/M2/
      - name: Aggregate and fail closed
        run: python physbench/exp2_1c/aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp2-1c-final
          path: |
            evidence/FINAL/
            evidence/M1/summary.json
            evidence/M2/summary.json
            physbench/exp2_1c/
          retention-days: 90
          if-no-files-found: error
