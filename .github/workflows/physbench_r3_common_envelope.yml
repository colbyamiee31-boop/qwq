name: PhysBench R3 Common Physical Envelope

on:
  workflow_dispatch:
  push:
    branches: [r3-common-physical-envelope]

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 numpy==1.26.4
      - name: Download exact frozen R2 prepared CTIFL cohorts
        uses: actions/download-artifact@v4
        with:
          name: r2-prepared-inputs
          path: physbench/r3/generated
          run-id: 37145919425
          github-token: ${{ github.token }}
      - name: Protocol, input and syntax gates
        run: python physbench/r3/test_protocol.py
      - uses: actions/upload-artifact@v4
        with:
          name: r3-prepared-inputs
          path: physbench/r3/generated/
          retention-days: 90
          if-no-files-found: error

  m1:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: r3-prepared-inputs
          path: physbench/r3/generated
      - name: Install frozen M1
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/BartvLaatum/GreenLight-Gym2.git GreenLight-Gym2
          git -C GreenLight-Gym2 checkout --detach 2d3febb1ea002b24b452e32293e990beb78d3ce1
          python -m pip install --upgrade pip
          python -m pip install -r physbench/r1_2/requirements-m1.txt ./GreenLight-Gym2
          python -m pip freeze | sort > evidence_R3_M1_PIP_FREEZE.txt
      - name: Run M1 common-envelope experiment
        run: python physbench/r3/m1_harmonised.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-m1
          path: |
            evidence/R3/M1/
            evidence_R3_M1_PIP_FREEZE.txt
          retention-days: 90
          if-no-files-found: error

  m2:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: r3-prepared-inputs
          path: physbench/r3/generated
      - name: Install frozen M2
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          git -C CSGtom checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          python -m pip install --upgrade pip
          python -m pip install -r physbench/r1_2/requirements-m2.txt
          python -m pip freeze | sort > evidence_R3_M2_PIP_FREEZE.txt
      - name: Run M2 common-envelope experiment
        run: python physbench/r3/m2_harmonised.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-m2
          path: |
            evidence/R3/M2/
            evidence_R3_M2_PIP_FREEZE.txt
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [prepare, m1, m2]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - uses: actions/download-artifact@v4
        with:
          name: r3-prepared-inputs
          path: physbench/r3/generated
      - uses: actions/download-artifact@v4
        with:
          name: r3-m1
          path: dl_m1
      - uses: actions/download-artifact@v4
        with:
          name: r3-m2
          path: dl_m2
      - name: Assemble current R3 evidence
        run: |
          mkdir -p evidence/R3/M1 evidence/R3/M2
          cp -r dl_m1/evidence/R3/M1/* evidence/R3/M1/
          cp -r dl_m2/evidence/R3/M2/* evidence/R3/M2/
      - name: Download frozen native R1.2 baseline
        uses: actions/download-artifact@v4
        with:
          name: r1-2-final
          path: baseline_r12
          run-id: 37143141817
          github-token: ${{ github.token }}
      - name: Download frozen native R2 baseline
        uses: actions/download-artifact@v4
        with:
          name: r2-final
          path: baseline_r2
          run-id: 37145919425
          github-token: ${{ github.token }}
      - name: Download frozen EXP3.1 decision baseline
        uses: actions/download-artifact@v4
        with:
          name: exp3-1-final
          path: baseline_exp31
          run-id: 37024060571
          github-token: ${{ github.token }}
      - name: Aggregate R3 harmonisation consequences
        run: python physbench/r3/aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-final
          path: |
            evidence/R3/FINAL/
            evidence/R3/M1/summary.json
            evidence/R3/M2/summary.json
            physbench/r3/
          retention-days: 90
          if-no-files-found: error
