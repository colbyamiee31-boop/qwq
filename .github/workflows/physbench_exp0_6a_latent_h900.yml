name: PhysBench EXP0.6A Latent H900

on:
  workflow_dispatch:
  push:
    branches: [exp0-6-latent-state-robustness]

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install protocol dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Run frozen protocol tests and syntax checks
        run: |
          set -euxo pipefail
          python physbench/exp0_6/test_protocol.py -v
          python -m py_compile physbench/exp0_6/common.py
          python -m py_compile physbench/exp0_6/generate_prehistory.py
          python -m py_compile physbench/exp0_6/m1_latent_h900.py
          python -m py_compile physbench/exp0_6/m2_latent_h900.py
          python -m py_compile physbench/exp0_6/aggregate_h900.py

  m1-latent-h900:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M1
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'pandas==2.2.3'
          python -m pip install 'git+https://github.com/BartvLaatum/GreenLight-Gym2.git@2d3febb1ea002b24b452e32293e990beb78d3ce1'
          python -m pip freeze | sort > evidence_m1_pip_freeze.txt
      - name: Generate M1 latent ensemble and execute H900 boundaries
        run: |
          set -euxo pipefail
          python physbench/exp0_6/m1_latent_h900.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp0-6a-m1-latent-h900
          path: |
            evidence/EXP0_6A_M1/
            evidence_m1_pip_freeze.txt
            physbench/exp0_6/
          retention-days: 90
          if-no-files-found: error

  m2-latent-h900:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M2
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          git -C CSGtom checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.23.5' 'scipy==1.14.1' 'pandas==2.2.3' 'xlrd==2.0.1'
          python -m pip freeze | sort > evidence_m2_pip_freeze.txt
      - name: Generate M2 latent ensemble and execute H900 boundaries
        run: |
          set -euxo pipefail
          python physbench/exp0_6/m2_latent_h900.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp0-6a-m2-latent-h900
          path: |
            evidence/EXP0_6A_M2/
            evidence_m2_pip_freeze.txt
            physbench/exp0_6/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [m1-latent-h900,m2-latent-h900]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: exp0-6a-m1-latent-h900
          path: _m1
      - uses: actions/download-artifact@v4
        with:
          name: exp0-6a-m2-latent-h900
          path: _m2
      - name: Stage model evidence
        run: |
          set -euxo pipefail
          mkdir -p evidence/EXP0_6A_M1 evidence/EXP0_6A_M2
          cp -a _m1/evidence/EXP0_6A_M1/. evidence/EXP0_6A_M1/
          cp -a _m2/evidence/EXP0_6A_M2/. evidence/EXP0_6A_M2/
      - name: Aggregate latent-state boundary robustness
        run: |
          set -euxo pipefail
          python physbench/exp0_6/aggregate_h900.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp0-6a-final
          path: |
            evidence/EXP0_6A_M1/
            evidence/EXP0_6A_M2/
            evidence/EXP0_6A_FINAL/
            physbench/exp0_6/
          retention-days: 90
          if-no-files-found: error
