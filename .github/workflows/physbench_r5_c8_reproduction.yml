name: R5 C8 REF0 reproduction gate

on:
  push:
    branches:
      - r5-field-ventilation-flux
    paths:
      - physbench/r5/C8_TRIGGER_ONCE.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: r5-c8-one-shot
  cancel-in-progress: false

jobs:
  dispatch_guard:
    if: github.run_attempt == 1 && contains(github.event.head_commit.added, 'physbench/r5/C8_TRIGGER_ONCE.txt')
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce one-time C8 marker and reject prior runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          MARKER_ADDED: ${{ contains(github.event.head_commit.added, 'physbench/r5/C8_TRIGGER_ONCE.txt') }}
        run: |
          set -euo pipefail
          test "$GH_RUN_ATTEMPT" = "1"
          test "$MARKER_ADDED" = "true"
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          run_id = str(os.environ["GH_RUN_ID"])
          workflow = "physbench_r5_c8_reproduction.yml"
          branch = "r5-field-ventilation-flux"
          url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch={branch}&per_page=100"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          runs = payload.get("workflow_runs", [])
          if not any(str(item.get("id")) == run_id for item in runs):
              raise SystemExit("One-shot guard failed: current run is absent from workflow history.")
          previous = [item for item in runs if str(item.get("id")) != run_id]
          if previous:
              raise SystemExit("One-shot guard failed: a prior/concurrent C8 run already exists.")
          print("One-shot C8 guard PASS: marker was added once and no other C8 run exists.")
          PY

  prepare:
    needs: dispatch_guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r5-field-ventilation-flux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 numpy==1.26.4
      - name: Download exact frozen R4 prepared inputs
        uses: actions/download-artifact@v4
        with:
          name: r4-prepared-inputs
          path: physbench/r5/generated
          run-id: 37164458429
          github-token: ${{ github.token }}
      - name: Run field-flux reference tests and frozen-input gates
        run: |
          mkdir -p evidence/R5/C8
          set -o pipefail
          python -I physbench/r5/field_flux.py 2>&1 | tee evidence/R5/C8/field_flux_unit_tests.log
          python -I physbench/r5/test_protocol.py 2>&1 | tee evidence/R5/C8/protocol_input_checks.log
      - name: Preserve precheck logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-c8-precheck-logs
          path: evidence/R5/C8/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve validated R4 input for downstream jobs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r5-c8-prepared-inputs
          path: physbench/r5/generated/
          retention-days: 90
          if-no-files-found: error

  c8:
    needs: [dispatch_guard, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r5-field-ventilation-flux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: r5-c8-prepared-inputs
          path: physbench/r5/generated
      - name: Install frozen M1 GreenLight and R4 dependency set
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/BartvLaatum/GreenLight-Gym2.git GreenLight-Gym2
          git -C GreenLight-Gym2 checkout --detach 2d3febb1ea002b24b452e32293e990beb78d3ce1
          python -m pip install --upgrade pip
          python -m pip install -r physbench/r1_2/requirements-m1.txt -c physbench/r5/r4-pip-constraints.txt ./GreenLight-Gym2
          python -m pip freeze | sort > evidence_R5_M1_PIP_FREEZE.txt
      - name: Rerun REF0/CF0 on the strict frozen 40-event cohort only
        run: |
          mkdir -p evidence/R5/C8
          set -o pipefail
          python physbench/r5/m1_c8_reproduction.py 2>&1 | tee evidence/R5/C8/c8_model_console.log
      - name: Preserve C8 model output and dependency record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-c8-model-output
          path: |
            evidence/R5/C8/
            evidence_R5_M1_PIP_FREEZE.txt
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    needs: [dispatch_guard, prepare, c8]
    if: always() && needs.dispatch_guard.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r5-field-ventilation-flux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 numpy==1.26.4
      - name: Download precheck logs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r5-c8-precheck-logs
          path: precheck-output
      - name: Download prepared frozen input
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r5-c8-prepared-inputs
          path: prepared
      - name: Download partial or complete C8 model output
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r5-c8-model-output
          path: model-output
      - name: Download frozen R3 HV reference
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r3-m1
          path: baseline_r3
          run-id: 37163085468
          github-token: ${{ github.token }}
      - name: Download frozen R4 CF0 reference
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: r4-m1
          path: baseline_r4
          run-id: 37164458429
          github-token: ${{ github.token }}
      - name: Compare C8 responses with frozen R4 CF0 and write audit report
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          C8_RESULT: ${{ needs.c8.result }}
        run: |
          mkdir -p evidence/R5/C8
          set -o pipefail
          python -I physbench/r5/aggregate_c8.py 2>&1 | tee evidence/R5/C8/c8_aggregate_console.log
      - name: Upload complete C8 reproduction package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-c8-reproduction
          path: |
            evidence/R5/C8/
            evidence_R5_M1_PIP_FREEZE.txt
          retention-days: 90
          if-no-files-found: warn
