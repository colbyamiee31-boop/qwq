name: PhysBench EXP3.4B Physical Dose Matched Decision

on:
  workflow_dispatch:
  push:
    branches: [exp3-4b-physical-dose-matched-decision]

permissions:
  actions: read
  contents: read

jobs:
  protocol-and-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run protocol tests
        run: |
          set -euxo pipefail
          python physbench/exp3_4b/test_protocol.py -v
      - name: Compile execution files
        run: |
          set -euxo pipefail
          python -m py_compile physbench/exp3_4b/m1_matched_dose.py
          python -m py_compile physbench/exp3_4b/m2_matched_dose.py
          python -m py_compile physbench/exp3_4b/decision_analysis.py

  m1:
    needs: protocol-and-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen EXP3.4A artifact
        uses: actions/download-artifact@v4
        with:
          name: exp3-4a-final
          path: _exp34a
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: colbyamiee31-boop/qwq
          run-id: 37095887502
      - name: Stage frozen EXP3.4A evidence
        run: |
          set -euxo pipefail
          mkdir -p evidence
          cp -a _exp34a/evidence/EXP3_4A_FINAL evidence/
          cp -a _exp34a/evidence/EXP3_4A_M1 evidence/
          cp -a _exp34a/evidence/EXP3_4A_M2 evidence/
          echo "e07e64d8f8f7ac914a68b5cda73e0a76f5b9bd890a81473a42dd8ee8f6656292  evidence/EXP3_4A_FINAL/common_physical_dose_targets_for_EXP3_4B.csv" | sha256sum -c -
      - name: Install frozen M1
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp3_1/requirements-m1.txt
          python -m pip install 'git+https://github.com/BartvLaatum/GreenLight-Gym2.git@2d3febb1ea002b24b452e32293e990beb78d3ce1'
          python -m pip freeze | sort > EXP3_4B_M1_PIP_FREEZE.txt
      - name: Solve M1 matched physical doses
        run: |
          set -euxo pipefail
          python physbench/exp3_4b/m1_matched_dose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp3-4b-m1
          path: |
            evidence/EXP3_4B_M1/
            EXP3_4B_M1_PIP_FREEZE.txt
            physbench/exp3_4b/
          retention-days: 90
          if-no-files-found: error

  m2:
    needs: protocol-and-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen EXP3.4A artifact
        uses: actions/download-artifact@v4
        with:
          name: exp3-4a-final
          path: _exp34a
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: colbyamiee31-boop/qwq
          run-id: 37095887502
      - name: Stage frozen EXP3.4A evidence
        run: |
          set -euxo pipefail
          mkdir -p evidence
          cp -a _exp34a/evidence/EXP3_4A_FINAL evidence/
          cp -a _exp34a/evidence/EXP3_4A_M1 evidence/
          cp -a _exp34a/evidence/EXP3_4A_M2 evidence/
          echo "e07e64d8f8f7ac914a68b5cda73e0a76f5b9bd890a81473a42dd8ee8f6656292  evidence/EXP3_4A_FINAL/common_physical_dose_targets_for_EXP3_4B.csv" | sha256sum -c -
      - name: Install frozen M2
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          git -C CSGtom checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp3_1/requirements-m2.txt
          python -m pip freeze | sort > EXP3_4B_M2_PIP_FREEZE.txt
      - name: Solve M2 matched physical doses
        run: |
          set -euxo pipefail
          python physbench/exp3_4b/m2_matched_dose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp3-4b-m2
          path: |
            evidence/EXP3_4B_M2/
            EXP3_4B_M2_PIP_FREEZE.txt
            physbench/exp3_4b/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [m1,m2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: exp3-4b-m1
          path: _m1
      - uses: actions/download-artifact@v4
        with:
          name: exp3-4b-m2
          path: _m2
      - name: Download locked EXP3.1 final
        uses: actions/download-artifact@v4
        with:
          name: exp3-1-final
          path: _exp31
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: colbyamiee31-boop/qwq
          run-id: 37024060571
      - name: Stage result inputs
        run: |
          set -euxo pipefail
          mkdir -p evidence/EXP3_4B_M1 evidence/EXP3_4B_M2 evidence/EXP3_1_LOCKED_FINAL
          cp -a _m1/evidence/EXP3_4B_M1/. evidence/EXP3_4B_M1/
          cp -a _m2/evidence/EXP3_4B_M2/. evidence/EXP3_4B_M2/
          cp -a _exp31/evidence/FINAL/. evidence/EXP3_1_LOCKED_FINAL/
      - name: Analyze matched-dose decisions
        run: |
          set -euxo pipefail
          python physbench/exp3_4b/decision_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp3-4b-final
          path: |
            evidence/EXP3_4B_M1/
            evidence/EXP3_4B_M2/
            evidence/EXP3_4B_FINAL/
            physbench/exp3_4b/
          retention-days: 90
          if-no-files-found: error
