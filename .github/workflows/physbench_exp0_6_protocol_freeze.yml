name: PhysBench EXP0.6 Protocol Freeze

on:
  workflow_dispatch:
  push:
    branches: [exp0-6-latent-state-robustness]

permissions:
  contents: read

jobs:
  protocol-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install protocol-test dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Run EXP0.6 frozen protocol tests
        run: python physbench/exp0_6/test_protocol.py -v
      - name: Generate deterministic anchor histories
        run: |
          set -euxo pipefail
          python physbench/exp0_6/generate_prehistory.py
          test "$(find physbench/exp0_6/generated_anchor_histories -name 'H*_72h.csv' | wc -l)" -eq 17
      - uses: actions/upload-artifact@v4
        with:
          name: exp0-6-protocol-freeze
          path: |
            physbench/exp0_6/PROTOCOL.md
            physbench/exp0_6/latent_history_config.json
            physbench/exp0_6/generate_prehistory.py
            physbench/exp0_6/test_protocol.py
            physbench/exp0_6/generated_anchor_histories/
          retention-days: 90
          if-no-files-found: error
