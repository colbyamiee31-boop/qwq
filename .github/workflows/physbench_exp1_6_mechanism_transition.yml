name: PhysBench EXP1.6 Mechanism Transition

on:
  workflow_dispatch:
  push:
    branches: [exp1-6-mechanism-transition-surface]

permissions:
  contents: read

jobs:
  analytic-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 11 search and identifiability tests
        run: python -m unittest discover -s physbench/exp1_6 -p test_numerics.py -v

  m1-real-model:
    needs: analytic-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M1
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/BartvLaatum/GreenLight-Gym2.git GreenLight-Gym2
          git -C GreenLight-Gym2 checkout --detach 2d3febb1ea002b24b452e32293e990beb78d3ce1
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp1_6/requirements-m1.txt ./GreenLight-Gym2
          python -m pip freeze | sort > EXP1_6_M1_PIP_FREEZE.txt
      - name: Reproduce M1 EXP1.5 and run EXP1.6
        run: |
          set -euxo pipefail
          python physbench/exp1_5/m1_closure_residual_audit_adapter.py
          python physbench/exp1_6/hosted_run.py --model M1 --model-source GreenLight-Gym2 --out evidence/M1_grid
          python physbench/exp1_6/refine.py --parent evidence/M1_grid --model-source GreenLight-Gym2 --out evidence/M1_refined
          python physbench/exp1_6/polish.py --parent evidence/M1_refined --model-source GreenLight-Gym2 --out evidence/M1_audited
          python physbench/exp1_6/verify.py evidence/M1_audited
      - name: Upload M1 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp1-6-m1-hosted-ci
          path: |
            evidence/
            EXP1_5_M1_*
            EXP1_6_M1_PIP_FREEZE.txt
            physbench/exp1_6/
          retention-days: 90
          if-no-files-found: error

  m2-real-model:
    needs: analytic-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M2
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          git -C CSGtom checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp1_6/requirements-m2.txt
          python -m pip freeze | sort > EXP1_6_M2_PIP_FREEZE.txt
      - name: Reproduce M2 EXP1.5
        run: |
          set -euxo pipefail
          (cd CSGtom/models && python ../../physbench/exp1_5/m2_boundary_mechanism_stability.py)
      - name: Run sharded M2 EXP1.6
        run: |
          set -euxo pipefail
          python physbench/exp1_6/run_shards.py --model-source CSGtom --out evidence/M2_grid_shards --workers 6
          python physbench/exp1_6/refine_shards.py --parents evidence/M2_grid_shards --model-source CSGtom --out evidence/M2_refined_shards --workers 6
          python physbench/exp1_6/refine_shards.py --parents evidence/M2_refined_shards --model-source CSGtom --out evidence/M2_audited_shards --workers 6 --stage polish
          python physbench/exp1_6/aggregate.py evidence/M2_audited_shards evidence/M2_audited
          python physbench/exp1_6/verify.py evidence/M2_audited
      - name: Upload M2 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp1-6-m2-hosted-ci
          path: |
            evidence/
            EXP1_5_M2_*
            EXP1_6_M2_PIP_FREEZE.txt
            physbench/exp1_6/
          retention-days: 90
          if-no-files-found: error
