name: PhysBench EXP3.2 Decision Robustness

on:
  workflow_dispatch:
  push:
    branches: [exp3-2-decision-robustness]

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install protocol-test dependency
        run: python -m pip install numpy==1.26.4
      - name: Run frozen robustness protocol tests
        run: python physbench/exp3_2/test_protocol.py -v

  m1-fine-grid:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M1
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/BartvLaatum/GreenLight-Gym2.git GreenLight-Gym2
          git -C GreenLight-Gym2 checkout --detach 2d3febb1ea002b24b452e32293e990beb78d3ce1
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp3_1/requirements-m1.txt ./GreenLight-Gym2
      - name: Run M1 9-point action grid
        run: |
          set -euxo pipefail
          python physbench/exp3_2/m1_fine_action_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp3-2-m1-fine-grid
          path: evidence/EXP3_2_M1/
          retention-days: 90
          if-no-files-found: error

  m2-fine-grid:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M2
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/jdsjxin/CSGtom.git CSGtom
          git -C CSGtom checkout --detach bea8c3b0a1324162a4b5487db578aa674c8b587c
          python -m pip install --upgrade pip
          python -m pip install -r physbench/exp3_1/requirements-m2.txt
      - name: Run M2 9-point action grid
        run: |
          set -euxo pipefail
          python physbench/exp3_2/m2_fine_action_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp3-2-m2-fine-grid
          path: evidence/EXP3_2_M2/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [m1-fine-grid,m2-fine-grid]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: exp3-2-m1-fine-grid
          path: evidence/EXP3_2_M1
      - uses: actions/download-artifact@v4
        with:
          name: exp3-2-m2-fine-grid
          path: evidence/EXP3_2_M2
      - name: Aggregate pre-specified robustness panel and fail closed
        run: |
          set -euxo pipefail
          python physbench/exp3_2/robustness_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp3-2-final
          path: |
            evidence/EXP3_2_M1/
            evidence/EXP3_2_M2/
            evidence/EXP3_2_FINAL/
            physbench/exp3_2/
          retention-days: 90
          if-no-files-found: error
